name = "ainfinity"
defaultTargets = ["Util", "ComputableCochainComplex", "AInfinity", "KLRW"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = false
maxSynthPendingDepth = 3

[[require]]
name = "checkdecls"
git = "https://github.com/PatrickMassot/checkdecls.git"

[[require]]
name = "«doc-gen4»"
git = "https://github.com/leanprover/doc-gen4"
rev = "v4.30.0-rc1"

[[require]]
name = "mathlib"
scope = "leanprover-community"

# General-purpose utilities (LaTeX rendering of terms via `#texify`).
[[lean_lib]]
name = "Util"

# Computable categorical constructions: biproducts, additive completion,
# and bounded cochain complexes.
[[lean_lib]]
name = "ComputableCochainComplex"

# A∞-categories, functors, and the Stasheff identities.
[[lean_lib]]
name = "AInfinity"

# The KLRW algebra and category, and the computable one-black-strand special case with the
# braiding action on its objects.
[[lean_lib]]
name = "KLRW"
