      module: "AInfinity.AInfinityCategory"
      status: "defined"
    - source: "Blueprint, Definition (A∞-category)"
      lean: "AInfinityTheory.AInfinityCategory"
      module: "AInfinity.AInfinityCategory"
      status: "defined"
    - source: "Blueprint, Lemma (Stasheff sum vanishes in an A∞-category)"
      lean: "AInfinityTheory.AInfinityCategory.indexedStasheffSum_eq_zero"
      module: "AInfinity.AInfinityCategory"
      status: "proved"
    - source: "Seidel, A∞-functors and the A∞-functor equations"
      lean: ""
      module: ""
      status: "not-formalized"
      note: "Formalized on the earlier foundation; temporarily removed pending a port."
    - source: "Seidel, composition of A∞-functors"
      lean: ""
      module: ""
      status: "not-formalized"
