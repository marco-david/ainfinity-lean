# See https://github.com/mathlib-initiative/formalization.yaml for the standard.

version: "v0.4"

project:
  name: "A∞ Categories in Lean"
  description: >-
    A Lean 4 / Mathlib formalization of A∞-category theory, developed as a research
    project at UC Berkeley with the goal of upstreaming to Mathlib. It defines
    grading types (an abelian group of degrees with integer degree shifts and a Koszul
    sign character, which covers bigradings such as ℤ × ℤ), graded linear and
    multilinear maps of a fixed degree, graded R-linear quivers, the Stasheff
    identities with Koszul signs, and R-linear A∞-categories. A∞-functors, their
    composition and the examples were developed on an earlier foundation. They are
    temporarily removed while they are ported to the current one.
    A second strand of the project formalizes the KLRW algebra of a loopless
    quiver with prescribed black and red strands, and its R-linear KLRW category,
    and builds computable categorical infrastructure (explicit biproducts, the
    additive completion CMat_, bounded cochain complexes) towards an
    A∞-endofunctor on a variant of the KLRW category that acts as a braid group
    invariant.
  authors:
    - "Marco David"
    - "Jason Dong"
    - "Hallvard Hareide"
    - "Jasper van de Kreeke"
    - "Lillian Liu"
    - "Justin Mu"
    - "Niels Voss"
    - "Annie Yao"
  responsible_maintainers:
    - "Marco David"
  license: "Apache-2.0"

sources:
  - title: "Fukaya Categories and Picard–Lefschetz Theory"
    authors:
      - "Paul Seidel"
    id: "ISBN 978-3-03719-063-0; doi:10.4171/063"
    type: "book"
    location: "Chapter I (A∞-categories and the A∞-associativity equations)"
    relationship: "adapts"
    note: >-
      Source for the A∞ constructions: A∞-categories and the Stasheff identities.
      The formalization adapts these definitions to a general grading type and to
      diagrammatic argument order; see `fidelity`. A∞-functors and their
      composition, also from this chapter, are not in the current code (see
      `status`).
    author_endorsement: "not-contacted"
  - title: "A∞ Categories in Lean (project blueprint)"
    authors:
      - "Marco David"
      - "Jason Dong"
      - "Hallvard Hareide"
      - "Jasper van de Kreeke"
      - "Lillian Liu"
      - "Justin Mu"
      - "Niels Voss"
      - "Annie Yao"
    id: "https://marcodavid.net/A∞/"
    type: "blueprint"
    location: >-
      Chapters 2–6: gradings and graded linear maps, Stasheff data, A∞-categories,
      A∞-algebras, KLRW category
    relationship: "formalizes"
    note: >-
      The project's own leanblueprint, which fixes the precise statements and sign
      conventions that the Lean code implements. It is also the source for the
      computable additive completion, the bounded cochain complexes, and the
      braiding functor (chapter 6). Its sources live in `blueprint/src/`.
    author_endorsement: "participated"
  - title: "Aganagic's invariant is Khovanov homology"
    authors:
      - "Elise LePage"
      - "Vivek Shende"
    id: "arXiv:2505.00327"
    type: "article"
    relationship: "formalizes"
    note: >-
      Source for the KLRW algebra and KLRW category formalized in
      `KLRW/KLRWAlgebra.lean` and `KLRW/KLRWCategory.lean`. The endorsement is from Elise
      LePage.
    author_endorsement: "endorsed"

related_formalizations:
  - id: "https://github.com/leanprover-community/mathlib4"
    relationship: "builds-on"
    note: >-
      Built on Mathlib (multilinear maps, `Int.negOnePow` for Koszul signs,
      preadditive and linear categories, free algebras and polynomial rings). Graded
      linear maps are indexed like Mathlib's `CochainComplex.HomComplex.Cochain`. The
      project aims to upstream its A∞-category definitions to Mathlib.

classification:
  arxiv:
    - "math.CT"
    - "math.RT"
    - "math.GT"
  msc2020:
    - "18G70"
    - "57K18"
    - "20F36"

status:
  scope: >-
    Complete (sorry-free): grading types with the standard and product gradings,
    graded linear and multilinear maps (with their module structure and the
    associativity and unit laws of composition), graded R-linear quivers, the
    Stasheff identities, A∞-categories, and the general KLRW algebra with its
    R-linear KLRW category. In progress: the computable additive completion and
    bounded cochain complexes, and the braiding functor, whose definitions are
    still partially stubbed with `sorry`. Temporarily removed: A∞-functors, their
    composition, the identity A∞-functor and the A∞ examples. They were written
    for the earlier foundation (grading indices and `GradedObject`s in
    `ModuleCat`) and will be restored once ported. A∞-algebras (blueprint
    chapter 5) are not formalized yet.
  # Counts come from a source scan for `sorry`. They were not checked with
  # `#print axioms`.
  sorry_count: 23
  sorry_in_definitions: 20
  axioms:
    - "propext"
    - "Classical.choice"
    - "Quot.sound"
    - "sorryAx"

automation:
  methods:
    - method: "manual"
      tool_setup: >-
        Hand-written Lean 4 in the usual Mathlib workflow (VS Code + Lean 4
        extension), with a leanblueprint for planning.
    - method: "agent"
      framework: "GitHub Copilot coding agent, OpenAI Codex, Claude Code"
      tool_setup: >-
        Coding agents running on the repository. `AGENTS.md` gives them the project
        context and the Mathlib conventions to follow.
      prompting_notes: >-
        Agents were given scoped tasks such as finishing or repairing proofs after
        definition changes, refactors, and repository maintenance. Their output was
        submitted as pull requests and reviewed like human contributions.
  notes: >-
    Mostly manual. Coding agents assisted on selected tasks, and every
    agent-produced change went through the same PR review as human changes.

fidelity:
  divergences: >-
    (1) Grading is over an arbitrary `GradingType`: an additive commutative group β
    with integer degree shifts `shift : ℤ →+ β` and a Koszul sign character
    `sign : β →+ Additive ℤˣ` such that `shift 1` is odd. β need not be a ring, so
    bigradings such as ℤ × ℤ or ℤ × ZMod 2 are allowed, not just ℤ or ℤ/2. (2) A
    graded R-linear quiver assigns to objects X, Y and a degree i an R-module
    `Hom X Y i`, over a commutative ring R. The operations m_n are graded
    multilinear maps of degree `shift (2 − n)` on each composable string of
    objects. (3) Arguments are in diagrammatic (left-to-right) order, the reverse
    of Seidel's convention, so the Koszul sign of the (r, s) Stasheff term is
    (−1)^(|a_{r+s+1}| + ⋯ + |a_n| − (n − r − s)). (4) No unitality is assumed.
    (5) The KLRW algebra is defined for an arbitrary loopless quiver on a finite
    vertex set, with prescribed numbers of black and red strands per vertex, over
    the coefficient ring R[u, ℏ] (`MvPolynomial (Fin 2) R`), as the quotient of a
    free algebra by the KLRW relations. The KLRW category has hom-modules
    e_Y · A · e_X and is preadditive and R-linear. (6) The braiding
    functor is still being developed on a separate computable model with one black
    strand and n red strands (`KLRW/OneBlackStrand.lean`), which was the project's
    first KLRW example, and its data assumes coefficients of characteristic 2.

review:
  status: "peer-reviewed"
  notes: >-
    Internal review only. Every pull request is reviewed by at least one team
    member other than its author before merging. There has been no external review
    yet.

alignment:
  namespace: "AInfinityTheory"
  # `source` entries prefixed "Blueprint" refer to the project blueprint, "Seidel" to
  # Seidel's book, and "LePage–Shende" to arXiv:2505.00327.
  statements:
    - source: "Blueprint, Definition (Grading type)"
      lean: "AInfinityTheory.GradingType"
      module: "AInfinity.Grading"
      status: "defined"
    - source: "Blueprint, Lemma (Sign of an integer shift)"
      lean: "AInfinityTheory.sign_shift"
      module: "AInfinity.Grading"
      status: "proved"
    - source: "Blueprint, Definition (Standard gradings)"
      lean: "AInfinityTheory.GradingType.instInt"
      module: "AInfinity.Grading"
      status: "defined"
      note: "Together with `AInfinityTheory.GradingType.instZModOfNatNat` for ZMod 2."
    - source: "Blueprint, Definition (Product gradings)"
      lean: "AInfinityTheory.GradingType.prodFst"
      module: "AInfinity.Grading"
      status: "defined"
      note: "Together with `AInfinityTheory.GradingType.prodTotal` for the total sign."
    - source: "Blueprint, Definition (Graded linear map)"
      lean: "AInfinityTheory.GradedLinearMap"
      module: "AInfinity.GradedLinearAlgebra"
      status: "defined"
    - source: "Blueprint, Lemma (Composition of graded linear maps)"
      lean: "AInfinityTheory.GradedLinearMap.comp_assoc"
      module: "AInfinity.GradedLinearAlgebra"
      status: "proved"
      note: "Together with `GradedLinearMap.id_comp` and `GradedLinearMap.comp_id`."
    - source: "Blueprint, Definition (Graded multilinear map)"
      lean: "AInfinityTheory.GradedMultilinearMap"
      module: "AInfinity.GradedLinearAlgebra"
      status: "defined"
    - source: "Blueprint, Definition (Graded linear quiver)"
      lean: "AInfinityTheory.GradedLinearQuiver"
      module: "AInfinity.AInfinityCategory"
      status: "defined"
    - source: "Blueprint, Definition (A∞-composition)"
      lean: "AInfinityTheory.AInfinityComposition"
      module: "AInfinity.Stasheff"
      status: "defined"
    - source: "Blueprint, Definition (Indexed Stasheff term)"
      lean: "AInfinityTheory.indexedStasheffTerm"
      module: "AInfinity.Stasheff"
      status: "defined"
    - source: "Blueprint, Definition (Stasheff sign)"
      lean: "AInfinityTheory.stasheffSign"
      module: "AInfinity.Stasheff"
      status: "defined"
    - source: "Blueprint, Definition (Indexed Stasheff sum)"
      lean: "AInfinityTheory.indexedStasheffSum"
      module: "AInfinity.Stasheff"
      status: "defined"
    - source: "Blueprint, Definition (Indexed Stasheff identities)"
