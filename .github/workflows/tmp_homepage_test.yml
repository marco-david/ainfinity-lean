# TEMPORARY: exercise the upstream docgen-action's blueprint + Jekyll (Ruby 3.4) steps on a
# push event without the API docs build or a deploy (to be removed before merge).
name: tmp homepage test
on:
  push:
    branches:
      - claude/dazzling-edison-unmesq
permissions:
  contents: read
jobs:
  homepage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build project
        uses: leanprover/lean-action@434f25c2f80ded67bba02502ad3a86f25db50709 # 2025-07-02
        with:
          use-github-cache: false
          build: true
          lint: false
          mk_all-check: true
      - name: Generate documentation assets (no API docs, no deploy)
        uses: leanprover-community/docgen-action@dacc1acc2a3f532cc577266979ba9c36c7593f7c # main, 2026-10-05
        with:
          api-docs: false
          blueprint: true
          homepage: "site"
          deploy: false
          use-github-cache: false
      - name: Show generated site
        run: ls -la site/_site site/_site/blueprint | head -40
