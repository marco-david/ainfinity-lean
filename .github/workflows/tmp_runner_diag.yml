# TEMPORARY: runner resource diagnostics (to be removed before merge).
name: tmp runner diag
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diag:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Resources
        run: |
          set -x
          uname -r
          nproc
          free -h
          swapon --show || true
          cat /proc/sys/vm/overcommit_memory /proc/sys/vm/overcommit_ratio
          head -5 /proc/meminfo
          df -h / /mnt /tmp || true
          mount | grep -E ' /tmp | /mnt ' || true
          ulimit -a
          cat /proc/sys/kernel/threads-max /proc/sys/kernel/pid_max
          systemctl show -p DefaultTasksMax -p DefaultMemoryAccounting 2>/dev/null || true
          cat /sys/fs/cgroup/memory.max 2>/dev/null || true
          cat /proc/self/cgroup
