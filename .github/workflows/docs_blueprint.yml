# Sample workflow for building and deploying a Jekyll site to GitHub Pages
name: Build Lean Docs and Blueprint

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    # Pinned to ubuntu-24.04 rather than ubuntu-latest. Since 2026-10-19 `ubuntu-latest` is
    # being migrated to the ubuntu-26.04 image (kernel 7.0), on which regenerating the Mathlib
    # API docs from scratch (every push to master whose docs cache has expired) fails
    # deterministically with `resource exhausted (error code: 12, cannot allocate memory)`
    # while Lake forks helper processes, even though the runner still has ~14 GB free and
    # extra swap does not help. The same build passes on ubuntu-24.04.
    # See https://github.com/actions/runner-images/issues/14748.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build project
        uses: leanprover/lean-action@434f25c2f80ded67bba02502ad3a86f25db50709 # 2025-07-02
        with:
          use-github-cache: false
          build: true
          lint: false
          mk_all-check: true
      - name: Generate documentation assets
        # Pinned to upstream `main` (2026-10-05); it includes the fixes for
        # https://github.com/leanprover-community/docgen-action/issues/28 that the
        # dwrensha fork used to carry, and also validates the Jekyll homepage on pull requests.
        uses: leanprover-community/docgen-action@dacc1acc2a3f532cc577266979ba9c36c7593f7c # main, 2026-10-05
        with:
          blueprint: true
          homepage: "site"
