name: Lean Action CI

on:
  push:
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read # Read access to repository contents

# Both jobs are pinned to ubuntu-24.04 rather than ubuntu-latest: Lake forks helper processes
# and the ubuntu-26.04 image (kernel 7.0) makes those forks fail with ENOMEM under load.
# See the comment in docs_blueprint.yml.
jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/lean-toolchain
      - uses: leanprover/lean-action@v1
        with:
          # Do not save `.lake` to the GitHub Actions cache. Mathlib's oleans come from
          # `lake exe cache get` anyway, and every such entry (several GB, one per commit)
          # counts against the repository's 10 GB cache quota, evicting the Mathlib API docs
          # cache that `docs_blueprint.yml` relies on to avoid rebuilding all of Mathlib's docs.
          use-github-cache: false
      # We are disabling this for now, since it seems to regenerate docs for all of Mathlib, which takes too long.
      # - uses: leanprover-community/docgen-action@v1

  mk-all: # checks that the top-level library files import every module (`lake exe mk_all --check`)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/lean-toolchain
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          use-github-cache: false
      - name: Check mk_all is up to date
        run: lake exe mk_all --check
