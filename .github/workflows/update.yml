name: Update Mathlib

# Opens one pull request per new stable Mathlib release (no release candidates, no Mathlib
# `master`): `lean-toolchain` and `lake-manifest.json` are updated and the project is built on
# the new toolchain first. If the build fails, an issue with the build log is opened instead.
#
# The checker compares Mathlib's release tags with this repository's own tags, which
# `lean_release_tag.yml` creates from `lean-toolchain`; without such a tag it proposes nothing.
#
# Setup outside this file:
#   * Settings > Actions > General: "Allow GitHub Actions to create and approve pull requests".
#   * A fine-grained personal access token for this repository with read and write access to
#     Contents, Pull requests and Issues, stored as the `UPDATE_ACTION_TOKEN` secret. Pull
#     requests opened with the default `GITHUB_TOKEN` do not trigger the CI workflows, so
#     without it the update PRs arrive untested by `lean_action_ci.yml`.

on:
  schedule:
    - cron: "23 7 * * 1" # Mondays, 07:23 UTC. Lean and Mathlib release roughly monthly.
  workflow_dispatch:

permissions:
  contents: read

# Both jobs run Lake, hence ubuntu-24.04 rather than ubuntu-latest; see lean_action_ci.yml.
jobs:
  check-for-updates: # Determines which releases to update to.
    runs-on: ubuntu-24.04
    outputs:
      is-update-available: ${{ steps.check-for-updates.outputs.is-update-available }}
      new-tags: ${{ steps.check-for-updates.outputs.new-tags }}
    steps:
      - name: Find stable Mathlib releases newer than the one in use
        id: check-for-updates
        uses: leanprover-community/mathlib-update-action@f8e3259913597ef668a7b360aa97eb3ebdfbc4c9 # main, 2026-10-02
        with:
          # START CONFIGURATION BLOCK 1
          intermediate_releases: stable
          # END CONFIGURATION BLOCK 1

  do-update: # Runs the upgrade, builds it, and opens a pull request or an issue.
    runs-on: ubuntu-24.04
    permissions:
      contents: write      # push the update branch
      issues: write        # open an issue when the build fails
      pull-requests: write # open the pull request
    needs: check-for-updates
    if: ${{ needs.check-for-updates.outputs.is-update-available == 'true' }}
    strategy: # One run per release found, oldest first.
      max-parallel: 1
      matrix:
        tag: ${{ fromJSON(needs.check-for-updates.outputs.new-tags) }}
    steps:
      - name: Update to ${{ matrix.tag }}, build, and open a pull request or an issue
        id: update-the-repo
        uses: leanprover-community/mathlib-update-action/do-update@f8e3259913597ef668a7b360aa97eb3ebdfbc4c9 # main, 2026-10-02
        with:
          tag: ${{ matrix.tag }}
          # START CONFIGURATION BLOCK 2
          on_update_succeeds: pr
          on_update_fails: issue
          # Falls back to the default token when the secret is not set; see the header comment.
          token: ${{ secrets.UPDATE_ACTION_TOKEN || github.token }}
          # END CONFIGURATION BLOCK 2
