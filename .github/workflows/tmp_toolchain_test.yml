# TEMPORARY: exercise the local lean-toolchain action in front of the pinned lean-action
# used by the docs workflow (to be removed before merge).
name: tmp toolchain test
on:
  push:
    branches:
      - claude/dazzling-edison-unmesq
permissions:
  contents: read
jobs:
  docs-lean-action:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/lean-toolchain
      - uses: leanprover/lean-action@434f25c2f80ded67bba02502ad3a86f25db50709 # 2025-07-02
        with:
          use-github-cache: false
          build: true
          lint: false
          mk_all-check: true
